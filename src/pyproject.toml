[tool.poetry]
name = "sherpa-ai"
version = "v0.6.0"
description = "Sherpa: AI-augmented thinking companion"
authors = []
readme = "README.md"
repository = "https://github.com/Aggregate-Intellect/sherpa"
packages = [
    { include = "sherpa_ai" },
    { include = "sherpa_ai/prompts/*.json" },
]

[tool.poetry.group.optional]
optional = true

[tool.poetry.group.test]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.dependencies]
python = "<3.14,>=3.10"
langchain-core = ">=1.5.0,<2.0"
langchain-community = ">=0.4.2,<0.5"
langchain-text-splitters = ">=1.1.2,<2.0"
python-dotenv = "^1.0.0"
langchain-openai = ">=1.3.5,<2.0"
tiktoken = ">=0.6.0,<1.0"
loguru = ">=0.7.0,<0.8.0"
pydantic = "^2.5.3"
transitions = "^0.9.2"
pydash = "^8.0.3"
pykka = "^4.2.0"
spacy = "3.8.7"
mcp = "^1.12.4"
# combined_number_extractor (used by NumberValidation) calls word_to_float on
# almost any text, so this must be a hard dependency, not optional — a normal
# install without the optional group would otherwise raise ImportError.
word2number = "^1.1"
# load_files (used by the vectorstore connectors) always extracts PDF text via
# pypdf, so this must be a hard dependency, not optional.
pypdf = "^6.13.3"
# citation_validation.py, actions/utils/refinement.py, and utils.py
# (compare_with_context) import nltk directly. It was previously only a
# transitive dependency of `unstructured`; dropping that package exposed
# this as a missing direct dependency.
nltk = "^3.9.1"
# langchain_core.language_models.base falls back to a GPT-2 tokenizer from
# transformers for any model without its own get_num_tokens implementation
# (e.g. FakeListLLM in tests, and some chat models). This path is exercised
# by the agent/policy runtime, not just by our own code, so this can't be
# optional even though nothing in sherpa_ai/ imports it directly. It was
# previously pulled in transitively by `unstructured`.
transformers = "^5.14.1"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = ">=4.1,<8.0"
# Direct-URL wheel: cannot live in [tool.poetry.dependencies], PyPI rejects
# direct references in published package metadata. Only extract_entities()
# needs it, and that is unreachable unless entity validation is explicitly
# enabled (BaseAgent.validations is empty by default), so it isn't a hard
# runtime dependency for a normal install — just pre-installed for CI.
# Without it, extract_entities() raises with a `python -m spacy download`
# instruction rather than pip-installing a wheel at runtime.
en_core_web_sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"}

[tool.poetry.group.optional.dependencies]
# Residual CVE (the "1 of 140" still open): PYSEC-2026-311 — pre-auth code
# injection affecting chromadb >=1.0.0. No fixed version exists yet (1.5.9 is the
# latest release and is still vulnerable), so it cannot be bumped away. Exposure
# requires running the Chroma server with trust_remote_code=true, which Sherpa
# does not do. Bump once an upstream fixed release ships.
chromadb = "^1.0.9"
langchain-chroma = "^0.2.5"
boto3 = "^1.28.77"
beautifulsoup4 = "4.12.2"


[tool.poetry.group.lint.dependencies]
bandit = "^1.7.8"
black = "^26.3.1"
flake8 = "^6.1.0"
isort = "^5.12.0"
flake8-pyproject = "^1.2.3"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
markers = [
  "external_api:  this test calls 3rd party APIs"
]

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88
ignore  = ['F401', 'W503', 'E501']

[tool.isort]
profile = "black"
skip_gitignore = true